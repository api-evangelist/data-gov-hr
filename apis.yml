  - Government Data
  - National Government
  - Croatia
  - Europe
created: '2026-06-23'
modified: '2026-06-23'
specificationVersion: '0.19'
apis:
  - aid: data-gov-hr:catalog
    name: data.gov.hr CKAN Action API
    description: >-
      CKAN Action API for data.gov.hr, a consistent JSON-over-HTTP interface over a catalog of roughly
      3,858 datasets. Standard actions include package_search, package_show, package_list,
      organization_list, group_list, and tag_list. Base URL https://data.gov.hr/ckan/api/3/action/
      (English variant under /ckan/en/). The portal also publishes DCAT-AP catalog feeds at
      /ckan/catalog.xml and /ckan/catalog.rdf.
    humanURL: https://data.gov.hr/en/
    baseURL: https://data.gov.hr/ckan/api/3/action
    tags:
      - CKAN
      - Action API
      - Open Data
      - Catalog
      - REST
      - JSON
    properties:
