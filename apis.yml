aid: data-gov-hr
name: data.gov.hr
description: >-
  data.gov.hr (Portal otvorenih podataka) is the national government open-data portal for Croatia,
  operated by the Ministry of Justice and Public Administration. It runs CKAN 2.9.9 and exposes the
  standard CKAN Action API over approximately 3,858 datasets, supporting programmatic dataset search,
  metadata retrieval, and resource access, plus DCAT-AP RDF/XML catalog feeds for EU harvesting. Note
  that the CKAN API is mounted under a non-default /ckan/ path prefix; root-level CKAN URLs return the
  Vue single-page-app HTML rather than JSON.
kind: government
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/data-gov-hr/refs/heads/main/apis.yml
tags:
